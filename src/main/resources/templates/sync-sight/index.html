<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sync Sight</title>
    <style>
        :root {
            --bg: #f5f6f8; --card: #ffffff; --text: #1c2230;
            --muted: #6b7385; --border: #dde1e9; --accent: #2f6fed;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14171f; --card: #1d222d; --text: #e8ebf2;
                --muted: #9aa3b5; --border: #2c3342; --accent: #6c9bff;
            }
        }
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
        main { max-width: 860px; margin: 0 auto; padding: 64px 24px; }
        h1 { margin: 0 0 8px; font-size: 32px; }
        .sub { color: var(--muted); margin: 0 0 40px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .card { display: block; padding: 28px; background: var(--card); border: 1px solid var(--border);
                border-radius: 12px; color: inherit; text-decoration: none; }
        .card:hover { border-color: var(--accent); }
        .card h2 { margin: 0 0 8px; color: var(--accent); }
        .card p { margin: 0; color: var(--muted); }
    </style>
</head>
<body>
<main>
    <h1>SYNC SIGHT</h1>
    <p class="sub">Enterprise vs Local</p>
    <div class="cards">
        <a class="card" th:href="@{/sync-sight/promotions/ongoing/starting}">
            <h2>Promotions</h2>
            <p>Promotion status per store, in Enterprise and Local.</p>
        </a>
        <a class="card" th:href="@{/sync-sight/elements/ongoing/starting}">
            <h2>Elements</h2>
            <p>Promotion element counts per store, in Enterprise and Local.</p>
        </a>
    </div>
</main>
</body>
</html>
