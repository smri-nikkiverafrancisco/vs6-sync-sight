<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="5" th:if="${refreshing or promotionsRefreshing}">
    <title th:text="${pageTitle}">Elements</title>
    <style>
        :root {
          --bg:#ffffff; --fg:#1f2328; --muted:#6b7280; --line:#d8dee4; --head:#f3f4f6;
        }
        @media (prefers-color-scheme: dark) {
          :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#30363d; --head:#161b22; }
        }
        body { margin:0; padding:24px; background:var(--bg); color:var(--fg);
               font-family:system-ui, Segoe UI, Arial, sans-serif; font-size:14px; }
        h1 { margin:0 0 4px; font-size:22px; letter-spacing:.5px; }
        .meta { color:var(--muted); line-height:1.6; margin-bottom:16px; }
        .meta b { color:var(--fg); }

        .viewbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; color:var(--muted); }
        .switch { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
        .switch a { padding:5px 14px; text-decoration:none; color:var(--muted); }
        .switch a + a { border-left:1px solid var(--line); }
        .switch a.active { background:var(--head); color:var(--fg); font-weight:600; }

        .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:12px; }
        .tab { padding:8px 16px; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0;
               text-decoration:none; color:var(--muted); }
        .tab.active { color:var(--fg); font-weight:600; border-color:var(--line); background:var(--head); }
        .count { display:inline-block; min-width:18px; padding:0 6px; margin-left:6px; border-radius:9px;
                 color:#fff; font-size:12px; text-align:center; }
        .count.warn { background:#bf8700; }

        .actions { margin-bottom:12px; display:flex; gap:8px; }
        button { padding:6px 12px; border:1px solid var(--line); background:var(--head); color:var(--fg);
                 border-radius:6px; cursor:pointer; }
        button:hover { border-color:var(--muted); }
        button:disabled { opacity:.5; cursor:not-allowed; }
        .refreshbar { display:flex; align-items:center; gap:10px; margin-top:6px; }
        .refreshbar form { margin:0; }

        .row { display:grid; grid-template-columns:1fr 1.4fr 1fr .8fr 1fr 1fr 1.4fr; gap:8px; padding:8px 10px; align-items:center; }
        .row.bystore { grid-template-columns:1fr 2.4fr 2.1fr; }
        .row.head { background:var(--head); font-weight:600; border:1px solid var(--line); border-radius:6px 6px 0 0; }
        details.promo { border:1px solid var(--line); border-top:none; }
        details.promo[open] { background:var(--head); }
        summary { list-style:none; cursor:pointer; }
        summary::-webkit-details-marker { display:none; }
        summary span:first-child::before { content:"▸ "; color:var(--muted); }
        details[open] summary span:first-child::before { content:"▾ "; }

        table.stores { margin:0 0 10px 28px; border-collapse:collapse; background:var(--bg); }
        table.stores th, table.stores td { padding:5px 14px; border:1px solid var(--line); text-align:left; }
        table.stores th { background:var(--head); }

        .sect { margin:0 0 28px; }
        .sect-title { display:flex; align-items:center; gap:10px; margin:0 0 8px; font-size:16px; }
        .sect-count { color:var(--muted); font-weight:normal; }

        .num { font-variant-numeric:tabular-nums; }
        .badge { display:inline-block; padding:2px 8px; border-radius:10px; color:#fff; font-size:12px;
                 background:var(--c, #6b7280); }
        .status-api-error { --c:#d4620a; }
        .status-no-elements { --c:#cf222e; }
        .status-connection-error { --c:#a40e26; }
        .status-timeout { --c:#9a6700; }
        .status-no-local-site { --c:#8c959f; }
        .hl-green { --c:#1a7f37; }
        .hl-amber { --c:#bf8700; }
        .st-matched { --c:#1a7f37; }
        .st-source-mismatch, .st-not-tally, .st-mismatch { --c:#bf8700; }
        .st-no-elements { --c:#cf222e; }
        .st-incomplete { --c:#d4620a; }

        .empty { padding:24px; color:var(--muted); border:1px dashed var(--line); border-radius:6px; }
    </style>
    <!-- top menu styles (shared with Promotions) -->
    <th:block th:replace="~{shared/topnav :: styles}"></th:block>
</head>
<body>

<!-- Elements top menu -->
<div th:replace="~{shared/elements-topnav :: nav}"></div>

<h1 th:text="${#strings.toUpperCase(pageTitle)}">STARTING PROMOTIONS</h1>
<div class="meta">
    <div th:text="${today}">Wednesday, October 14, 2026</div>
    <div>Retrieved Time: <b th:text="${retrievedTime}">00:00:00</b></div>
    <div>No. of Promos: <b th:text="${promoCount}">0</b></div>
    <div class="refreshbar">
        <form method="post" th:action="@{|${basePath}/refresh|}">
            <input type="hidden" name="tab" th:value="${tab}">
            <input type="hidden" name="view" th:value="${view}">
            <button type="submit" th:disabled="${refreshing or promotionsRefreshing}"
                    th:text="${refreshing} ? 'Refreshing...' : 'Refresh'">Refresh</button>
        </form>
        <span th:if="${refreshing}" th:text="${refreshText}"></span>
        <span th:if="${promotionsRefreshing and not refreshing}">Promotions are refreshing. Refresh is available when they finish.</span>
    </div>
</div>
<br><br>

<!-- Group by: applies to BOTH tabs -->
<div class="viewbar">
    <span>Group Results</span>
    <div class="switch">
        <a th:classappend="${view == 'promo'} ? 'active'"
           th:href="@{${basePath}(tab=${tab},view='promo')}">By Promo</a>
        <a th:classappend="${view == 'store'} ? 'active'"
           th:href="@{${basePath}(tab=${tab},view='store')}">By Store</a>
    </div>
</div>
<br>

<nav class="tabs">
    <a class="tab" th:classappend="${tab == 'all'} ? 'active'"
       th:href="@{${basePath}(tab='all',view=${view})}">All</a>
    <a class="tab" th:classappend="${tab == 'anomalies'} ? 'active'"
       th:href="@{${basePath}(tab='anomalies',view=${view})}">
        Anomalies
        <span class="count warn" th:if="${anomalyCount > 0}" th:text="${anomalyCount}">0</span>
    </a>
</nav>

<div class="actions">
    <button type="button" onclick="setAll(true)">Expand All</button>
    <button type="button" onclick="setAll(false)">Collapse All</button>
</div>

<div class="meta" th:if="${refreshError != null}" th:text="'Last refresh failed: ' + ${refreshError}"></div>

<div class="empty" th:if="${nothingToShow}" th:text="${emptyMessage}"></div>

<!-- ================= ALL TAB ================= -->
<th:block th:if="${tab == 'all' and view == 'promo' and not nothingToShow}">
    <div th:replace="~{elements/shared/element-fragments :: promoList(${promos})}"></div>
</th:block>
<th:block th:if="${tab == 'all' and view == 'store' and not nothingToShow}">
    <div th:replace="~{elements/shared/element-fragments :: storeList(${storeGroups})}"></div>
</th:block>

<!-- ================= ANOMALIES TAB: one section per kind of problem ================= -->
<th:block th:if="${tab == 'anomalies' and not nothingToShow}">
    <section class="sect" th:each="sec : ${sections}">
        <h2 class="sect-title">
            <span th:class="${sec.titleClass()}" th:text="${sec.title()}">No Elements</span>
            <span class="sect-count" th:text="${sec.rowCount()}">3</span>
        </h2>
        <th:block th:if="${view == 'promo'}">
            <div th:replace="~{elements/shared/element-fragments :: promoList(${sec.promos()})}"></div>
        </th:block>
        <th:block th:if="${view == 'store'}">
            <div th:replace="~{elements/shared/element-fragments :: storeList(${sec.storeGroups()})}"></div>
        </th:block>
    </section>
</th:block>

<script>
    // Open or close every promo/store row
    function setAll(open) {
      document.querySelectorAll('details.promo').forEach(function (d) { d.open = open; });
    }
</script>
</body>
</html>
