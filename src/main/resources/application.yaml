spring:
  application:
    name: sync-sight
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  thymeleaf:
    cache: false

vs6-enterprise:
  api:
    base-url: ${VS6_URL}
    auth:
      token: /auth/token
      username: ${VS6_USERNAME}
      password: ${VS6_PASSWORD}
    timeout-seconds: 60
  sync:
    threads: 6

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level: %msg%n"
  level:
    com.zaxxer.hikari: WARN